[workspace]
resolver = "3"
members = [
    "crates/api",
    "crates/protocol",
    "crates/ipc",
    "crates/core",
    "crates/tui",
    "crates/yoruplay",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
authors = ["YoruPlay contributors"]

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
md-5 = "0.10"
num-bigint = "0.4"
percent-encoding = "2"
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "http2", "stream"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
toml = "0.8"
tempfile = "3"
termtree = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
zbus = { version = "5", features = ["tokio"] }
aes = "0.8"
cbc = "0.1"
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "symphonia-aac", "symphonia-flac", "symphonia-isomp4", "symphonia-mp3", "symphonia-ogg", "symphonia-vorbis", "symphonia-wav", "symphonia-pcm"] }
symphonia = { version = "=0.5.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "vorbis", "wav", "pcm"] }
rtrb = "0.3"
redb = "=2.4.0"
lofty = "0.22"
rustix = { version = "1", features = ["fs"] }
toml_edit = { version = "0.22", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
