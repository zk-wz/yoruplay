[package]
name = "yoruplay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A lightweight Rust terminal music player for NetEase Cloud Music"

[[bin]]
name = "yoruplay"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[dependencies]
anyhow.workspace = true
clap.workspace = true
fs2.workspace = true
libc = "0.2"
serde_json.workspace = true
serde.workspace = true
termtree.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
yoruplay-api = { path = "../api" }
yoruplay-core = { path = "../core" }
yoruplay-ipc = { path = "../ipc" }
yoruplay-protocol = { path = "../protocol" }
yoruplay-tui = { path = "../tui" }
